name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - name: Install transcriber test dependencies
        run: python -m pip install -r discord-transcriber/requirements-test.txt
      - name: Test transcriber helpers
        working-directory: discord-transcriber
        run: python -m unittest discover -s tests
