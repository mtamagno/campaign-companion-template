<!-- Accordion — collapsible section with header and projected content -->
<div
  class="accordion"
  [class.accordion--open]="isOpen()"
  [class.accordion--overflow]="allowOverflow()"
>
  <button
    class="accordion__header"
    type="button"
    [attr.aria-expanded]="isOpen()"
    (click)="toggle()"
  >
    @if (icon()) {
      <span class="accordion__icon">{{ icon() }}</span>
    }
    <span class="accordion__title">{{ title() }}</span>
    <span class="accordion__chevron" aria-hidden="true">&#9660;</span>
  </button>

  <div class="accordion__panel">
    <div class="accordion__content">
      <ng-content />
    </div>
  </div>
</div>
